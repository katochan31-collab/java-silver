;color:#fff}.num.wrong{background:#ef4444;color:#fff}.num.answered{background:#f59e0b;color:#fff}.drawer{position:fixed;inset:0;z-index:80;background:#0006;display:none;align-items:flex-end}.drawer.show{display:flex}.drawerbox{width:100%;max-height:76vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + var(--safe-b))}.drawerhead{display:flex;justify-content:space-between;align-items:center}.close{min-width:44px;min-height:44px;border:0;border-radius:50%;font-size:22px}.save-note{font-size:12px;color:#64748b;margin-top:8px}@media (min-width:768px){main{padding:0 24px;margin-top:22px}.card{padding:24px}.choice{min-height:64px;font-size:17px}.grid{grid-template-columns:repeat(12,1fr)}.bottom{left:50%;right:auto;transform:translateX(-50%);width:min(100%,980px);border:1px solid var(--line);border-bottom:0;border-radius:15px 15px 0 0}.drawer{align-items:center;justify-content:center}.drawerbox{width:min(720px,90vw);border-radius:18px;max-height:80vh}}@media (orientation:landscape) and (max-height:600px){header{display:none}.top{padding:5px 10px}.bar{top:43px}main{margin:8px auto}.card{padding:12px}.choice{min-height:49px;padding:10px 12px}.bottom{padding-top:6px}.btn{min-height:44px}.drawerbox{max-height:90vh}}@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><header><h1>Java Silver 黒本 模擬試験①</h1><div>iPhone・iPad最適化版。全60問を問題番号順に出題します。</div></header><div class="top"><span class="pill" id="pos">1 / 60</span><span class="pill" id="score">正解 0</span><button class="btn secondary" id="openGrid">問題一覧</button></div><div class="bar"><div id="bar"></div></div><main><div id="iosFallback" style="background:#fff7da;border:1px solid #eab308;border-radius:12px;padding:14px;margin-bottom:14px;line-height:1.6"><b>iPhone/iPadの「ファイル」プレビューで開いていますか？</b><br>このテストはJavaScriptを使います。ファイルのプレビューでは問題データを表示できない場合があります。WebサイトとしてSafariで開くとテスト機能・途中保存が動作します。</div><section class="card" id="quiz"><div class="meta">黒本 模擬試験①</div><div class="title" id="title"></div><div class="question" id="question"></div><div class="codewrap" id="codewrap"><pre class="code" id="body"></pre></div><div class="choices" id="choices"></div><div class="fb" id="fb"></div></section><section class="card finish" id="finish"><h2>テスト終了</h2><h3 id="result"></h3><button class="btn primary" id="again">最初からやり直す</button></section></main><nav class="bottom" aria-label="問題操作"><button class="btn secondary" id="prev">前へ</button><button class="btn primary" id="judge">回答確定</button><button class="btn primary" id="next">次へ</button></nav><div class="drawer" id="drawer"><div class="drawerbox"><div class="drawerhead"><h2>問題一覧</h2><button class="close" id="closeGrid">×</button></div><div class="legend"><span><i class="dot u"></i>未回答</span><span><i class="dot c"></i>正解</span><span><i class="dot w"></i>不正解</span><span><i class="dot" style="background:#f59e0b"></i>選択中</span></div><div class="grid" id="grid"></div><div class="save-note">回答状況は、このブラウザ内に自動保存されます。</div><button class="btn secondary" id="reset" style="width:100%;margin-top:16px">保存データを消して最初から</button></div></div><script>
document.getElementById('iosFallback').style.display='none';const Q=[{"no": 1, "title": "次のプログラムを確認してください。", "body": "```java\npublic interface A {\n    boolean search(int[] data, int target);\n}\n```\n\n```java\npublic interface B extends A {\n    @Override\n    default boolean search(int[] data, int target) {\n        int cnt = 0;\n        for (int i : data) {\n            if (i == target) {\n                cnt++;\n            }\n        }\n        return cnt > 0;\n    }\n}\n```\n\n```java\npublic class C implements B {\n\n}\n```\n\n```java\npublic class Sample {\n    public static void main(String... args) {\n        if (new C().search(\n            new int[]{1, 2, 3, 7, 9},\n            Integer.parseInt(args[0]))) {\n                System.out.println(\"A\");\n        } else {\n                System.out.println(\"B\");\n        }\n    }\n}\n```", "choices": ["「A」と表示される", "「B」と表示される", "コンパイルエラーが発生する", "実行時に例外がスローされる"], "correct": ["B"], "tip": {"topic": "ローカル変数", "look": "宣言だけのc", "rule": "ローカル変数にデフォルト値なし。使用前初期化必須"}, "explanation": ""}, {"no": 2, "title": "次のプログラムを確認してください。", "body": "```java\npackage ex.p1;\n\npublic class A {\n\n}\n```\n\n```java\npackage ex.p2;\n\npublic class B {\n\n}\n```\n\n上記の2つのクラスを次のプログラムで利用するために必要なimport文として、正しいものを選択肢から選びなさい。(2つ選択)\n\n```java\npublic class C extends A {\n    public void sample() {\n        B b = new B();\n    }\n}\n```", "choices": ["import ex.p1.A;", "import ex.*;", "import static ex.p1.*;\n   import static ex.p2.*;", "import static ex.p1.A;\n   import static ex.p2.B;", "import ex.p2.*;"], "correct": ["A", "E"], "tip": {"topic": "public class / ファイル名", "look": "publicはAだけ", "rule": "A.javaでコンパイル→A.class/B.class両方生成可能"}, "explanation": ""}, {"no": 3, "title": "次のプログラムをコンパイル、実行したときの結果として、正しいものを選びなさい。(1つ選択)", "body": "```java\npublic class A implements AutoCloseable {\n    private String name;\n    public A(String name) {\n        this.name = name;\n    }\n    public void close() throws Exception {\n        System.out.println(name);\n    }\n}\n```\n\n```java\npublic class Sample {\n    public static void main(String[] args)\n                            throws Exception {\n        try (A a = new A(\"A\");\n                A b = new A(\"B\")) {\n        } finally {\n            System.out.println(\"C\");\n        }\n    }\n}\n```", "choices": ["「C」と表示される", "「B」「A」の順に表示される", "「C」「B」「A」の順に表示される", "「B」「A」「C」の順に表示される", "「C」「B」「A」の順に表示される", "「A」「B」「C」の順に表示される"], "correct": ["D"], "tip": {"topic": "static", "look": "static print→contents", "rule": "staticからinstance fieldを直接参照不可"}, "explanation": "try-with-resourcesで宣言されたリソースは、宣言された順とは逆順にcloseメソッドが呼ばれる。closeメソッドはtryブロックを抜けるタイミングで呼ばれるメソッドで、finallyブロックはその後に表示されるから。"}, {"no": 4, "title": "次のプログラムをコンパイル、実行したときの結果として、正しいものを1つ選びなさい。(1つ選択)", "body": "```java\npublic class Sample {\n    public static void main(String[] args) {\n\n        String a = new String(\"sample\");\n        String b = a;\n        String c = a.intern();\n        String d = \"sample\";\n\n        if (a == b) {\n            System.out.println(\"A\");\n        }\n        if (a == c) {\n            System.out.println(\"B\");\n        }\n        if (a == d) {\n            System.out.println(\"C\");\n        }\n        if (b == c) {\n            System.out.println(\"D\");\n        }\n        if (b == d) {\n            System.out.println(\"E\");\n        }\n        if (c == d) {\n            System.out.println(\"F\");\n        }\n    }\n}\n```", "choices": ["「A」「F」と表示される", "「A」と表示される", "「A」「B」「C」「D」「E」「F」と表示される", "「A」「D」と表示される"], "correct": ["A"], "tip": {"topic": "数値literal / boxing", "look": "0b0110の型", "rule": "suffixなし整数literalは基本int→NumberへboxingするとInteger"}, "explanation": "a.intern()は、a自体を変えるわけではなく、文字列プールに戻したaをcに代入している。"}, {"no": 5, "title": "次のクラスのサブクラスとして、正しいものを選びなさい。(2つ選択)", "body": "```java\npublic class A {\n\n}\n```", "choices": ["static class B extends A {}", "protected class B extends A {}", "sealed class B extends A {}", "non-sealed class B extends A {}", "public class B extends A {}", "final class B extends A {}", "private class B extends A {}"], "correct": ["E", "F"], "tip": {"topic": "例外階層", "look": "例外発生行を最初に見る", "rule": "null.equals…→NPE→RuntimeException catch"}, "explanation": ""}, {"no": 6, "title": "次のプログラムをコンパイル、実行したときの結果として、正しいものを選びなさい。(1つ選択)", "body": "```java\npublic class A {\n    private var num = 10; //(1)\n    public A(String num) {\n        var var = Integer.parseInt(num); //(2)\n        this.num = var; //(3)\n    }\n    public void print() {\n        int var = num; //(4)\n        System.out.println(var); //(5)\n    }\n}\n```\n\n\n```java\npublic class Sample {\n    public static void main(String[] args) {\n        new A(\"20\").print();\n    }\n}\n```", "choices": ["正しくコンパイルされ、実行すると10が表示される", "正しくコンパイルされ、実行すると20が表示される", "（2）の行でコンパイルエラーが発生する", "（3）の行でClassCastExceptionがスローされる", "（4）の行でコンパイルエラーが発生する", "（5）の行でNumberFormatExceptionがスローされる"], "correct": ["E"], "tip": {"topic": "cast / static type", "look": "B b = new C()", "rule": "呼べるメソッドは参照型から判定。さらにcast構文自体も確認"}, "explanation": "var はローカル変数専用\n\n✅ 使える\nメソッド内のローカル変数\nコンストラクタ内のローカル変数\nfor文のループ変数\n拡張for文のループ変数\n❌ 使えない\nインスタンス変数（フィールド）\nクラス変数（staticフィールド）\nメソッド引数\nコンストラクタ引数\n戻り値型\n配列要素型\n初期値なしの宣言\nnullでの初期化"}, {"no": 7, "title": "次のクラスのサブクラスとして、正しいものを選びなさい。(1つ選択)", "body": "```java\npublic sealed class A permits B, C {\n\n}\n```", "choices": ["public non-sealed class D extends A {}", "public class B extends A {}", "public class B extends A {}", "public abstract class C extends A {}", "public non-sealed class C extends A {}", "public final class B extends A {}", "public final class D extends A {}"], "correct": ["E", "F"], "tip": {"topic": "field hiding + override", "look": "dataとgetData()を分離", "rule": "fieldは参照型、override methodは実体型"}, "explanation": ""}, {"no": 8, "title": "次のうちコンパイラによってチェックされる例外はどれですか。(2つ選択)", "body": "【この問題は問題文が見出し部分に収録されています。下の選択肢から回答してください。】", "choices": ["java.lang.ArrayIndexOutOfBoundsException", "java.lang.ClassCastException", "java.lang.Exception", "java.lang.ArithmeticException", "java.io.IOException", "java.lang.NumberFormatException", "java.lang.RuntimeException"], "correct": ["C", "E"], "tip": {"topic": "catch + finally", "look": "実際にthrowされる型", "rule": "最も具体的なcatchへ。その後finally必ず実行"}, "explanation": "非チェック例外は、RuntimeExceptionとその子クラス\n\n```\nThrowable\n ├─ Error\n └─ Exception\n      ├─ IOException\n      └─ RuntimeException\n            ├─ ClassCastException\n            ├─ ArithmeticException\n            ├─ NumberFormatException\n            └─ ArrayIndexOutOfBoundsException\n```"}, {"no": 9, "title": "次のプログラムを確認してください。", "body": "```java\npublic class A {\n    public int num;\n    public A(int num) {\n        this.num = num;\n    }\n}\n```\n\n```java\npublic class B extends A {\n    public B(int num) {\n        super(num);\n    }\n}\n```\n\n```java\npublic interface Sample {\n    A execute(int num);\n}\n```\n\nSampleインタフェースを実装したクラスに記述できるメソッドの定義として、正しいものを選びなさい。(2つ選択)", "choices": ["public B execute(Integer num) {\n    return new B(num);\n}", "public Object execute(int num) {\n    return new A();\n}", "public A execute(int num) {\n    return new B(num);\n}", "public B execute(int num) {\n    return new B(num);\n}", "public A execute(Integer num) {\n    return new A(num);\n}"], "correct": ["C", "D"], "tip": {"topic": "switch式", "look": "配列を左から変換", "rule": "各値→caseの文字に機械的に置換"}, "explanation": "オーバーライドできる条件（復習）\n・メソッド名：同じ\n・引数リスト：同じ\n・戻り値：同じ、または共変戻り値\n\nA:　引数が違う。Integerなので、オーバーライドではなくオーバーロードになっている\nB: 戻り値がObjectになっている。オーバーライドでは、AかAのサブクラスしか返せない。ObjectはAの親なので間違い。\nC: 引数一致。戻り値はB(num)であり、BはAの子クラス。共変戻り値なのでOK.\nD: 引数一致。戻り値はB(num)であり、BはAの子クラス。共変戻り値なのでOK.\nE: 引数不一致。Integerなので、オーバーライドではない。\n\n※確認の仕方\n試験でインタフェースA execute(int num);をみたら、\n1．メソッド名が一致しているか\n2．引数が一致しているか\n3．戻り値がＡまたはＡの子クラスになっているか\n\n※追加質問\nB型を引数付でreturnして大丈夫？\nB is an Aの関係だから大丈夫。\n\n```\nnew B(num)\n↓\npublic B(int num) {\nsuper(num);\n}\n↓\npublic A(int num) {\nthis.num = num;\n}\n\n```"}, {"no": 10, "title": "次のプログラムをコンパイル、実行したときの結果として、正しいものを選びなさい。(1つ選択)", "body": "```java\npublic class A {\n    public void execute() {\n        System.out.println(\"A\");\n    }    \n}\n```\n\n```java\npublic class B extends A {\n    public void test() {\n        System.out.println(\"B\");\n    }\n    public void execute() {\n        test();\n    }\n}\n```\n\n```java\npublic class Main {\n    public static void main(String[] args) {\n        Object[] objects = {\n            new A(), new B(), \"C\"\n        };\n        for (Object obj : objects) {\n            test(obj);\n        }\n    }\n\n    private static void test(Object obj) {\n        if (obj instanceof A b) {\n            b.execute();\n        }\n    }\n    \n}\n```", "choices": ["何も出力されない", "A, Bの順に出力される", "A, B, Cの順に出力される", "Bが表示される", "Cが表示される", "コンパイルエラーが発生する", "実行時に例外がスローされる"], "correct": ["B"], "tip": {"topic": "record / cast", "look": "constructorと強制cast", "rule": "canonical constructorは引数必要。Object→Item castは実行時ClassCastException"}, "explanation": ""}, {"no": 11, "title": "インスタンス変数a,b,c,dの値を変更するメソッドはどれか。正しいものを選びなさい。(1つ選択)", "body": "```java\npublic class Test {\n    int a, b, c, d;\n\n    void setA(int a) {\n        a = a;\n    }\n    void setB() {\n        this.b = b;\n    }\n    int setC() {\n        return c;\n    }\n    int setD(int d) {\n        d = d;\n        return d;\n    }\n    void setAll(int x) {\n        a = b = this.c = d = setD(x);\n    }\n}\n```", "choices": ["setAメソッド", "setBメソッド", "setCメソッド", "setDメソッド", "setAllメソッド", "どのメソッドも変更しない"], "correct": ["E"], "tip": {"topic": "String生成数", "look": "literalとnewを分離", "rule": "pool sample 1個 + new 2個"}, "explanation": "A: a = aは、引数 = 引数になっているので、インスタンス変数は一切触っていない。\nB: 一見変更しているように見えるが、bというローカル変数はどこにもいない。そのため右辺のbはthis.bと解釈され、this.b = this.bとなり、自分自身を代入しているだけになる。\nC: returnで単に値を返しているだけで、インスタンス変数は一切触っていない。\nD: setAと同じく、d = dで、インスタンス変数は一切触っていない。\nE: まず、右側から計算する。setD(x)は、例えばx=100のとき、100を返す。\nすると、a = b = this.c = d = 100となる。(代入演算子は右から左へ評価される)\n\n変数名が重なったら、\nvoid setA(int a)\nを見た瞬間に、\n・引数のa\n・フィールドのa\nのどっち？と考えるクセを付 ava\nint data = 0xFF0000;\nString str = \"\";\nswitch (data) {\n    case 0x0000FF : str = \"A\"; break;\n    case 0x008000 : str = \"B\"; break;\n    case 0xFF0000 : str = \"C\"; break;\n    case 0xFFFF00 : str = \"D\"; break;\n    case 0xFFFFFF : str = \"E\"; break;\n    default : str = \"F\";\n}\n```", "choices": ["String str = switch (data) {\n    case 0x0000FF -> \"A\"; break;\n    case 0x008000 -> \"B\"; break;\n    case 0xFF0000 -> \"C\"; break;\n    case 0xFFFF00 -> \"D\"; break;\n    case 0xFFFFFF -> \"E\"; break;\n    default -> \"F\";\n};", "String str = switch (data) {\n    case 0x0000FF -> \"A\";\n    case 0x008000 -> \"B\";\n    case 0xFF0000 -> \"C\";\n    case 0xFFFF00 -> \"D\";\n    case 0xFFFFFF -> \"E\";\n    default -> \"F\";\n};", "String str = switch (data) {\n    case 0x0000FF -> \"A\";\n    case 0x008000 -> \"B\";\n    case 0xFF0000 -> \"C\";\n    case 0xFFFF00 -> \"D\";\n    case 0xFFFFFF -> \"E\";\n    default : yield \"F\";\n};", "String str = switch (data) {\n    case 0x0000FF : color = \"A\";\n    case 0x008000 : color = \"B\";\n    case 0xFF0000 : color = \"C\";\n    case 0xFFFF00 : color = \"D\";\n    case 0xFFFFFF : color = \"E\";\n    default : color = \"F\";\n};", "String str = switch (data) {\n    case 0x0000FF := \"A\";\n    case 0x008000 := \"B\";\n    case 0xFF0000 := \"C\";\n    case 0xFFFF00 := \"D\";\n    case 0xFFFFFF := \"E\";\n    default := \"F\";\n};", "String str = switch (data) {\n    case 0x0000FF : yield \"A\";\n    case 0x008000 : yield \"B\";\n    case 0xFF0000 : yield \"C\";\n    case 0xFFFF00 : yield \"D\";\n    case 0xFFFFFF : yield \"E\";\n};"], "correct": ["B"], "tip": {"topic": "sealed", "look": "A permits B", "rule": "Bはfinal/sealed/non-sealedのいずれか"}, "explanation": "・アローを使った場合breakを書くとコンパイルエラー\n・switch式を使った場合は->アローを書く。:や:=はコンパイルエラー\n・switch式の場合はdefaultを省略できない\n・switch式には2通りの書き方がある。アロー構文の場合は、break, yield不要だが、コロン構文の場合はbreakではなくyieldが必要。値を返すためにyieldを書く。\n・アロー構文とコロン構文を混在させることはできない。\n（AIお薦め解説）\n- アロー（->）を使った場合、break は書けない。書くとコンパイルエラー。\n- switch式では -> または : + yield を使用する。\n- := はJavaの構文ではないためコンパイルエラー。\n- switch式は値を返すため、すべての分岐で値を返せなければならない。\n- : を使用する場合は yield が必要。\n- -> と : を混在させることはできない。"}, {"no": 17, "title": "次のプログラムがコンパイルエラーになる理由として、正しいものを選びなさい。(1つ選択)", "body": "```java\npublic class Main {\n    public static void main(String[] args) {\n        ((A) new C()).sample();\n        ((B) new C()).sample();\n        ((C) new C()).sample();\n    }\n}\n\ninterface A {\n    default void sample() {\n        System.out.println(\"A\");\n    }\n}\n\nabstract sealed class B implements A {\n    private void sample() {\n        System.out.println(\"B\");\n    }\n}\n\nfinal class C extends B {\n    public void sample() {\n        System.out.println(\"C\");\n    }\n}\n```", "choices": ["Bクラスのsampleメソッドがprivateであるため、Cクラスでオーバーライドできない", "Bクラスのsampleメソッドがprivateであるため、Aインタフェースのsampleメソッドをオーバーライドできない。", "sealedキーワードの使い方が間違っているため。", "Bクラスがabstractであるため、sampleメソッドを定義する必要がある。", "Cクラスのsampleメソッドがpublicであるため、アクセス修飾子が一致しない。"], "correct": ["B"], "tip": {"topic": "override", "look": "A b = new B(); b.test()", "rule": "testはoverrideされているためB.test→hello→B"}, "explanation": ""}, {"no": 18, "title": "次のプログラムの空欄に入るコードとして、正しいものを選びなさい。(2つ選択)", "body": "```java\npublic class Sample {\n    public int test(int a, int b) {\n        return a + b;\n    }\n    // Enter here any code\n}\n```", "choices": ["public long test(Integer i) {\n    return i.longValue();\n}", "public int test(int x, int y) {\n    return x + y;\n}", "public int test(Integer i, Integer j) {\n    return i + j;\n}", "public void test(int a, int b) {\n    return a + b;\n}", "private int test(int x, int y) {\n    return x + y;\n}"], "correct": ["A", "C"], "tip": {"topic": "boolean演算", "look": "短絡するか両方実行か", "rule": "resultが7になるようa,bとif本体/elseを追う"}, "explanation": "#### オーバーロードの条件\n- メソッド名が同じ\nかつ\n- 引数リストが異なる（引数の数、型、並び順）\n- 戻り値の型だけ違うものはオーバーロードにならない\n- アクセス修飾子だけ違うものはオーバーロードにならない"}, {"no": 19, "title": "シールクラスやfinalクラスについて正しい説明を選びなさい。(2つ選択)", "body": "【こ \", 200, 100);\n        System.out.println(s1.name + \", \" + s1.num + \", \" + s1.price);\n        System.out.println(s2.name + \", \" + s2.num + \", \" + s2.price);\n    }\n}\n```", "choices": ["sample 200 100\n   sample 200 100", "null 0 100\n   sample 200 100", "SubSampleクラスの3行目だけでコンパイルエラーになる", "SubSampleクラスの8行目だけでコンパイルエラーになる", "SubSampleクラスの3行目と8行目の両方でコンパイルエラーになる"], "correct": ["D"], "tip": {"topic": "配列宣言", "look": "new int[2]", "rule": "正式な配列生成構文を選ぶ"}, "explanation": "this() と super() はコンストラクタの先頭行のみ。\nsuper(name, num); の後に this(price); は書けない。\nしたがって 8行目だけコンパイルエラー → D が正解。"}, {"no": 53, "title": "次のプログラムをコンパイル、実行したときの結果として、正しいものを選びなさい。(1つ選択）", "body": "```java\ninterface A {\n    public void sample();\n}\n```\n\n```java\ninterface B extends A {\n    public void test();\n}\n```\n\n```java\nabstract class C implements B {\n    public void test() {\n        System.out.println(\"A\");\n    }\n}\n```\n\n```java\nclass D extends C {\n    public void test() {\n        System.out.println(\"B\");\n    }\n}\n```\n\n```java\npublic class Main {\n    public static void main(String[] args) {\n        C c = new D();\n        c.test();\n    }\n}\n```", "choices": ["「A」と表示される", "「B」と表示される", "Bインタフェースでコンパイルエラーが発生する", "Cクラスでコンパイルエラーが発生する", "Dクラスでコンパイルエラーが発生する"], "correct": ["E"], "tip": {"topic": "shallow clone", "look": "array1.clone()", "rule": "外側だけ複製。内側char[]は同じ参照"}, "explanation": "・Silver試験の見分け方\n　インタフェース + 抽象クラスの問題が出たら\n　インタフェースの抽象メソッドを数える\n　抽象クラスで実装済みか確認する\n　最後の具象クラスで未実装メソッドが残っていないか確認する\n\n・今回の要点\n　C は abstract なので sample() 未実装でもOK\n　D は具象クラスなので sample() を実装しなければならない\n　よって 正解は E"}, {"no": 54, "title": "例外処理に関する説明として、正しいものを選びなさい。(2つ選択)", "body": "【この問題は問題文が見出し部分に収録されています。下の選択肢から回答してください。】", "choices": ["finallyブロックは、tryブロックまたはcatchブロックのすぐ後ろに配置しなければいけない", "try-with-resourceのリソースを閉じる前に、finallyブロックが実行される", "tryブロックは複数のcatchブロックを持つことが出来る", "catchブロックは、一般的な型から特定の型への順に並べなければいけない", "tryブロックは、catchブロックとfinallyブロックを持たなければいけない"], "correct": ["A", "C"], "tip": {"topic": "constructor", "look": "new C()", "rule": "親→子のconstructor順"}, "explanation": "try は複数の catch を持てる\ncatch は 子 → 親 の順で書く\ntry-with-resources は close() → finally の順"}, {"no": 55, "title": "次のプログラムをコンパイル、実行したときの結果として、正しいものを選びなさい。(1つ選択)", "body": "```java\npublic class Main {\n    public static void main(String[] args) {\n        try {\n            throw new Exception();\n        } catch (Exception e) {\n            throw new RuntimeException();\n        } catch (RuntimeException e) {\n            System.out.println(\"A\");\n        } finally {\n            System.out.println(\"B\");\n        }\n    }\n}\n```", "choices": ["Aが表示される", "Bが表示される", "コンパイルエラーが発生する", "実行時に例外がスローされる"], "correct": ["C"], "tip": {"topic": "abstract class", "look": "abstract methodの書式", "rule": "abstractは本体なし、具象/static methodは本体あり"}, "explanation": "RuntimeException は Exception の子クラス\ncatch(Exception) の後に catch(RuntimeException) は書けない\n到達不能な catch になるため コンパイルエラー"}, {"no": 56, "title": "次のプログラムをコンパイル、実行したときの結果として、正しいものを選びなさい。(1つ選択)", "body": "```java\npublic class Main {\n    public static void main(String[] args) {\n        String s1 = new String(\"Java\");\n        String s2 = \"Java\";\n        String s3 = s2.intern();\n        System.out.print((s1 == s2) + \", \");\n        System.out.print((s2 == s3) + \", \");\n        System.out.print(s1 == s3);\n    }\n}\n```", "choices": ["「false,true,false」と表示される", "「true,true,true」と表示される", "「true,false,false」と表示される", "「true,true,false」と表示される", "「false,false,false」と表示される"], "correct": ["A"], "tip": {"topic": "値渡し", "look": "mainのa,bとフィールド", "rule": "primitive引数は値渡し。mainのa,bは2,3"}, "explanation": "new String(\"Java\") は新しいオブジェクトを作る\n\"Java\" と intern() は同じ String Pool を参照する"}, {"no": 57, "title": "次のプログラムをコンパイル、実行したときの結果として、正しいものを選びなさい。(1つ選択)", "body": "```java\npublic class Main {\n    public static void main(String[] args) {\n        char[][] arrays = {{'a', 'd'}, {'b', 'e'}, {'c', 'f'}};\n        for (char[] array: arrays) {\n            for (char ch: array) {\n                System.out.print(ch);\n            }\n            System.out.print(\" \");\n        }\n    }\n}\n```", "choices": ["「ad be cf」と表示される", "「abc def」と表示される", "「a d b e c f」と表示される", "「adb ecf」と表示される"], "correct": ["A"], "tip": {"topic": "field更新", "look": "t.num=0 / 差分modify", "rule": "100→0になる式を選ぶ"}, "explanation": "char[][] は「配列の配列」、外側の拡張forで1行ずつ取得\n\n\n ### 58. 次のプログラムをコンパイル、実行したときの結果として、正しいものを選びなさい。(1つ選択)\n\n ```java\n public class A {\n    protected A() {\n        this(2);\n        System.out.print(\"1\");\n    }\n    protected A(int a) {\n        System.out.print(a);\n    }\n }\n ```\n\n ```java\n public class B extends A {\n    B() {\n        this(4);\n        System.out.print(\"3\");\n    }\n    B(int b) {\n        System.out.print(b);\n    }\n }\n ```\n\n ```java\n public class Main {\n    public static void main(String [] args) {\n        B b = new B();\n    }\n }\n```\n\nA. ２１４３が表示される\nB. １２３４が表示される\nC. ４３２１が表示される\nD. ３４２１が表示される\n\n回答：A\n正答：A\n解説：コンストラクタ問題が出たら、\nthis() を最優先でたどる\n次に super() をたどる\n親コンストラクタから戻ってくる\n出力順を書く\nthis() は同一クラスの別コンストラクタへ移動\nsuper() は親コンストラクタへ移動\n実行順は A(int) → A() → B(int) → B()\n\n```\nnew B()\n\n↓\nB()\n ↓ this(4)\n\nB(4)\n ↓ super()\n\nA()\n ↓ this(2)\n\nA(2) → 2\nA()  → 1\nB(4) → 4\nB()  → 3\n```"}, {"no": 58, "title": "次のプログラムをコンパイル、実行したときの結果として、正しいものを選びなさい。(1つ選択)", "body": "public class A {\n   protected A() { this(2); System.out.print(\"1\"); }\n   protected A(int a) { System.out.print(a); }\n}\npublic class B extends A {\n   B() { this(4); System.out.print(\"3\"); }\n   B(int b) { System.out.print(b); }\n}\npublic class Main { public static void main(String[] args) { B b = new B(); } }", "choices": ["２１４３が表示される", "１２３４が表示される", "４３２１が表示される", "３４２１が表示される"], "correct": ["A"], "tip": {"topic": "setter", "look": "fieldと引数の同名", "rule": "this.value = valueでフィールドを変更"}, "explanation": "this()を最優先でたどり、次にsuper()。親コンストラクタから戻る順に出力する。"}, {"no": 59, "title": "次のプログラムを実行し、「abcd」と表示したい。「// insert code here」に入るコードとして、正しいものを選びなさい。(1つ選択)", "body": "```java\npublic class Sample {\n    public static void main(String[] args) {\n        String[][] array = new String[2][2];\n        array[0][0] = \"a\";\n        array[0][1] = \"b\";\n        array[1][0] = \"c\";\n        array[1][1] = \"d\";\n        // insert code here\n    }\n}\n```", "choices": ["for (int i = 1; i < 2; i++) {\n    for (int j = 1; j < 2; j++) {\n        System.out.print(array[i][j]);\n    }\n}", "for (int i = 0; i < 2; ++i) {\n    for (int j = 0; j < i; ++j) {\n        System.out.print(array[i][j]);\n    }\n}", "for (String a : array) {\n    for (String b : array) {\n        System.out.println(b);\n    }\n}", "for (int = 0; i < 2;) {\n    for (int j = 0; j < 2;) {\n        System.out.print(array[i][j]);\n        j++;\n    }\n    i++;\n}"], "correct": ["D"], "tip": {"topic": "override access", "look": "protected→package-private", "rule": "override時はアクセスを狭められない"}, "explanation": ""}, {"no": 60, "title": "次のプログラムをコンパイル、実行したときの結果として、正しいものを選びなさい。(1つ選択)", "body": "```java\npublic class Main {\n    public static void main(String[] args) {\n        String[] str = new String[2];\n        int i = 0;\n        for (String s : str) {\n            str[i].concat(\"e\" + i);\n            i++;\n        }\n        for (i = 0; i < str.length; i++) {\n            System.out.println(str[i]);\n        }\n    }\n}\n```", "choices": ["e0\n   e1", "null e0\n   null e1", "null\n   null", "実行時に例外がスローされる"], "correct": ["D"], "tip": {"topic": "連鎖代入", "look": "setD(x)から右→左", "rule": "setDでd=10、その10をc,b,aへ代入"}, "explanation": "new String[2] の要素は null\nnull.concat(...) は NullPointerException\nString は不変なので concat() は代入しないと反映されない"}];const KEY='javaSilverKuroMock1Mobile_v2';let state={idx:0,sel:{},done:{},score:0};const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const letters=a=>a.map(i=>String.fromCharCode(65+i));function equal(a,b){return a.length===b.length&&[...a].sort().every((x,i)=>x===[...b].sort()[i])}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Number.isInteger(x.idx))state={idx:Math.max(0,Math.min(59,x.idx)),sel:x.sel||{},done:x.done||{},score:Number(x.score)||0}}catch(e){}}function topPage(){window.scrollTo({top:0,behavior:'smooth'})}
function render(){const q=Q[state.idx],s=state.sel[q.no]||[];$('#pos').textContent=`${state.idx+1} / ${Q.length}`;$('#score').textContent=`正解 ${state.score}`;$('#bar').style.width=`${((state.idx+1)/Q.length)*100}%`;$('#title').textContent=`問${q.no}　${q.title||''}`;const body=(q.body||'').trim();$('#question').textContent=body&&!/[{};]|class |interface |public |private |protected |static |void |new /.test(body)?body:'';$('#body').textContent=body;$('#codewrap').style.display=body?'block':'none';$('#choices').innerHTML=q.choices.map((c,i)=>`<button class="choice ${s.includes(i)?'selected':''}" data-i="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(c)}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.i)),{passive:true}));$('#fb').className='fb';$('#fb').innerHTML='';$('#prev').disabled=state.idx===0;$('#judge').disabled=s.length===0||!!state.done[q.no];$('#next').textContent=state.idx===Q.length-1?'結果':'次へ';if(state.done[q.no])showResult(q);renderGrid();save()}
function choose(i){const q=Q[state.idx];if(state.done[q.no])return;let s=state.sel[q.no]||[];s=q.correct.length===1?[i]:(s.includes(i)?s.filter(x=>x!==i):[...s,i]);state.sel[q.no]=s;save();render()}
function judge(){const q=Q[state.idx];if(state.done[q.no]||!(state.sel[q.no]||[]).length)return;const ok=equal(letters(state.sel[q.no]),q.correct);state.done[q.no]={ok};if(ok)state.score++;save();render()}
function showResult(q){const s=state.sel[q.no]||[],ok=state.done[q.no].ok;document.querySelectorAll('.choice').forEach((b,i)=>{const L=String.fromCharCode(65+i);if(q.correct.includes(L))b.classList.add('correct');else if(s.includes(i))b.classList.add('wrong')});const f=$('#fb');f.className=`fb show ${ok?'ok':'ng'}`;let x=`<b>${ok?'正解です！':'不正解です'}</b><br>正答：${q.correct.join(', ')}`;if(!ok)x+=`<div class="tip"><b>⚡ 速解きのコツ</b><br><b>論点：</b>${esc(q.tip.topic)}<br><b>初見で見る：</b>${esc(q.tip.look)}<br><b>判断ルール：</b>${esc(q.tip.rule)}</div>`;if(q.explanation)x+=`<div class="exp"><b>復習メモ・解説</b><br>${esc(q.explanation)}</div>`;f.innerHTML=x}
function renderGrid(){let out='';for(const q of Q){let cls='';if(state.done[q.no])cls=state.done[q.no].ok?'correct':'wrong';else if((state.sel[q.no]||[]).length)cls='answered';if(Q[state.idx].no===q.no)cls+=' current';out+=`<button class="num ${cls}" data-no="${q.no}">${q.no}</button>`}$('#grid').innerHTML=out;document.querySelectorAll('.num').forEach(b=>b.onclick=()=>{state.idx=Q.findIndex(q=>q.no===Number(b.dataset.no));$('#drawer').classList.remove('show');save();render();topPage()})}
function finish(){judge();$('#quiz').style.display='none';$('#finish').classList.add('show');$('#result').textContent=`${state.score} / ${Q.length} 正解（${Math.round(state.score/Q.length*100)}%）`;save()}function resetAll(){state={idx:0,sel:{},done:{},score:0};try{localStorage.removeItem(KEY)}catch(e){}$('#finish').classList.remove('show');$('#quiz').style.display='block';render();topPage()}$('#prev').onclick=()=>{if(state.idx>0){state.idx--;render();topPage()}};$('#judge').onclick=judge;$('#next').onclick=()=>{const q=Q[state.idx];if(!state.done[q.no])judge();if(state.idx<Q.length-1){state.idx++;render();topPage()}else finish()};$('#openGrid').onclick=()=>{$('#drawer').classList.add('show');renderGrid()};$('#closeGrid').onclick=()=>$('#drawer').classList.remove('show');$('#drawer').addEventListener('click',e=>{if(e.target===$('#drawer'))$('#drawer').classList.remove('show')});$('#reset').onclick=()=>{if(confirm('保存した回答履歴を消して最初から始めますか？'))resetAll()};$('#again').onclick=resetAll;load();render();
